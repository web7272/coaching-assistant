<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 · 看見自己</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- PR-4c-green Auth rebuild stage 1c — magic-link callback page.
     6/7 P0 LAUNCH BLOCKER FIX (Patrick + Vivi):
       原本「載入即自動 POST verify-link」會被 email 掃描器 (SafeLinks /
       Gmail / Brevo render auth.html) 在 13–21 秒內觸發, 把單次 token
       吃掉. 真人後面點時就「連結已失效」, 6/11 CTA 進來的新用戶全部
       登不進、零轉換.
       → 修法: 載入時 NOT POST. 改 render 一個確認頁 + 按鈕,
       使用者點按鈕才 POST. 掃描器只 render、不 click → 不 POST →
       token 不消耗. verify-link.js (POST-only + 單次 used_at + 60min TTL)
       完全不動, 安全模型不變.
     - 既有 fail() 失效 UI (寄新連結 → /login.html) 保留.
     - 缺 token 仍走 fail() 既有錯誤路徑.
     - persistStudentSession 仍負責 student.js localStorage bridge. -->
<div id="app">
  <!-- 6/4 Patrick — app.css `.view{display:none}` 要 `.active` 才顯示. -->
  <section id="view-auth" class="view active" aria-label="登入確認">
    <div class="entry-container" id="auth-container" style="padding-top:96px;text-align:center;">
      <!-- JS 載入時把 #auth-status 換成確認頁 + 按鈕 (no auto-POST).
           ⚠️ v5.3 件3 PR-J5 ③ — 登入鈕 + verify-link 邏輯完全未動 (Patrick spec:
           「不動 auth.html 的登入/token/跳轉邏輯,只動畫面內容」). -->
      <div id="auth-status"></div>

      <!-- v5.3 件3 PR-J5 ③ — 5 步功能預覽 + 七步轉變說明.
           靜態 HTML、不參與 auth/token flow,放在 #auth-status 之下.
           4 張 APP 圖未掛載 (assets in shared-context/Landing, 待掛) → 用
           placeholder 圖框 + 文字標題. 第 5 步使用 storyboard 地圖 SVG. -->
      <div class="auth-preview">
        <p class="auth-preview__intro">這整套是透過『對話』,帶你走過 7 步的身分轉變;這趟轉變旅程,會同步呈現在『我的人生旅途』。</p>
        <ol class="auth-preview__steps">
          <li class="auth-preview__step">
            <span class="auth-preview__num">①</span>
            <div class="auth-preview__frame auth-preview__frame--placeholder" aria-hidden="true"></div>
            <span class="auth-preview__label">地圖頁</span>
          </li>
          <li class="auth-preview__step">
            <span class="auth-preview__num">②</span>
            <div class="auth-preview__frame auth-preview__frame--placeholder" aria-hidden="true"></div>
            <span class="auth-preview__label">對話</span>
          </li>
          <li class="auth-preview__step">
            <span class="auth-preview__num">③</span>
            <div class="auth-preview__frame auth-preview__frame--placeholder" aria-hidden="true"></div>
            <span class="auth-preview__label">教練筆記</span>
          </li>
          <li class="auth-preview__step">
            <span class="auth-preview__num">④</span>
            <div class="auth-preview__frame auth-preview__frame--placeholder" aria-hidden="true"></div>
            <span class="auth-preview__label">歡迎頁</span>
          </li>
          <li class="auth-preview__step">
            <span class="auth-preview__num">⑤</span>
            <div class="auth-preview__frame auth-preview__frame--icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="none"
                   stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M9 4 L3 6 V20 L9 18 L15 20 L21 18 V4 L15 6 Z"/>
                <path d="M9 4 V18"/>
                <path d="M15 6 V20"/>
              </svg>
            </div>
            <span class="auth-preview__label">我的人生旅途</span>
          </li>
        </ol>
      </div>
    </div>
  </section>
</div>

<script>
(function() {
  // ⚠️ Must match student.js's `LS_KEY` + the saveState() shape exactly —
  // student.js's loadState does Object.assign(state, JSON.parse(...)) on this
  // exact key, so any drift here = bounce-to-entry bug.
  const LS_KEY = 'sy.v5.student';

  /**
   * Merge magic-link verify response into student.js's localStorage state.
   * Preserves any existing transient fields (e.g. half-typed conversation
   * on a returning device); resets conversation + _lastSessionId since a
   * fresh magic-link login implies「new browser session、journey 重新進」.
   */
  function persistStudentSession(payload) {
    let existing = {};
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && typeof o === 'object') existing = o;
      }
    } catch { /* corrupted → start fresh */ }
    const merged = Object.assign({}, existing, {
      studentId:     payload.studentId,
      email:         existing.email || null,        // verify-link doesn't return email; preserve
      preferredName: payload.preferredName ?? null,
      pace:          payload.pace          || 'daily',
      module:        payload.module        || 'self',
      currentDay:    payload.currentDay    || 1,
      conversation:  [],                            // fresh login → journey 重新進、清 in-memory chat
      _lastSessionId: null,
    });
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(merged));
    } catch { /* quota / private mode — server cookie still works, SPA will hydrate via /api/me */ }
  }

  const status = document.getElementById('auth-status');

  /**
   * Render the「連結已失效 + 寄新連結」UI.
   * Used for: missing token / verify-link 4xx / network failure.
   * (Unchanged behaviour from 5/28 + 6/3 + 6/4 fixes; only the call sites move.)
   */
  function fail(msg, sub) {
    status.className = '';
    status.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'hint-italic';
    p.style.fontSize = '15px';
    p.style.marginBottom = '14px';
    p.textContent = msg;
    status.appendChild(p);
    if (sub) {
      const s = document.createElement('p');
      s.className = 'hint-italic';
      s.style.fontSize = '13px';
      s.style.opacity = '0.7';
      s.style.marginBottom = '24px';
      s.textContent = sub;
      status.appendChild(s);
    }
    // /login.html anchor — only on the FAIL path. Crawlers hitting THIS
    // anchor only ever land on /login (寄新連結 form), never consume a token.
    const a = document.createElement('a');
    a.href = '/login.html';
    a.className = 'btn-green';
    a.style.display = 'inline-block';
    a.style.padding = '10px 22px';
    a.textContent = '寄新連結 →';
    status.appendChild(a);
    // 6/4 Vivi — 移除 10s auto-redirect.
  }

  /**
   * Render the confirm UI: title + button. Button onclick → POST verify-link.
   *
   * 6/7 P0: this is the KEY change. The fetch happens ONLY inside the
   * button.onclick handler — never at top-level / load time. Email scanners
   * (SafeLinks / Gmail / Brevo) render the page (see the button) but do
   * not synthesize a click → no POST → token stays unused.
   */
  function renderConfirm(token) {
    status.className = '';
    status.innerHTML = '';

    // Headline.
    const h = document.createElement('p');
    h.className = 'hint-italic';
    h.style.fontSize = '15px';
    h.style.marginBottom = '20px';
    h.textContent = '準備好了嗎?點下面登入。';
    status.appendChild(h);

    // <button> element (NOT <a href> — anchors get followed by scanners).
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-green';
    btn.style.display = 'inline-block';
    btn.style.padding = '12px 30px';
    btn.textContent = '登入 →';

    // Click handler — the ONLY place that POSTs verify-link.
    btn.addEventListener('click', async function onLoginClick() {
      // Anti-double-click: disable + visual loading state.
      btn.disabled = true;
      btn.textContent = '登入中…';
      try {
        const res = await fetch('/api/auth/verify-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          fail('這個登入連結已失效。',
               '可能是已經點過、或太久沒打開(連結有效 60 分鐘)。跳到 /login 寄一個新的, 收到信後馬上點。');
          return;
        }
        const payload = await res.json();
        persistStudentSession(payload);
        location.href = '/#/journey';
      } catch (e) {
        fail('沒能登入。',
             '網路不穩、待會再試;或跳到 /login 寄新連結。');
      }
    });
    status.appendChild(btn);
  }

  // ─── Boot ─────────────────────────────────────────────────────
  // Synchronous only — no fetch here. Read token, render confirm UI OR fail.
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');

  if (!token) {
    fail('連結缺少 token、無法登入。',
         '跳到 /login、重新輸入 email 即可寄新連結。');
    return;
  }

  // Token present → render confirm. POST only fires on the real user's click.
  renderConfirm(token);
})();
</script>
</body>
</html>
