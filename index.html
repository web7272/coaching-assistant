<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看見自己</title>
<meta name="description" content="21 天 · 每天 5–10 分鐘">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">

  <!-- ─────────── §5.1 Entry — v2.1-green: logo hero + 3 fields + 開始 ─────────── -->
  <section id="view-entry" class="view" aria-label="入口">
    <div class="entry-container">
      <!-- P1 (PR-4c-green): logo hero — green telescope mark, 5/23 Vivi 已提供 -->
      <img src="/assets/logo.png" alt="看見自己" class="entry-logo">
      <h1 class="entry-title">看見自己</h1>
      <p class="entry-sub">21 天 · 一步一步，走進自己</p>

      <form id="entry-form" class="entry-form" novalidate>
        <!-- email -->
        <label class="entry-field-label" for="entry-email">你的 email</label>
        <input type="email" id="entry-email" class="entry-input" placeholder="email" autocomplete="email" required>

        <!-- 稱呼 -->
        <label class="entry-field-label entry-field-label--gap" for="entry-name">我可以怎麼稱呼你？</label>
        <input type="text" id="entry-name" class="entry-input" placeholder="名字或暱稱、隨你" autocomplete="given-name" maxlength="40">

        <!-- 步調二選一 — wording per spec §5.1 -->
        <fieldset class="entry-pace">
          <legend class="entry-field-label entry-field-label--gap">步調</legend>

          <label class="entry-pace-option">
            <input type="radio" name="pace" value="daily" checked>
            <span class="entry-pace-option__body">
              <span class="entry-pace-option__title">一天一輪對話</span>
              <span class="entry-pace-option__sub">每天沉澱一晚，隔天再繼續。</span>
            </span>
          </label>

          <label class="entry-pace-option">
            <input type="radio" name="pace" value="self-paced">
            <span class="entry-pace-option__body">
              <span class="entry-pace-option__title">依自己的步調</span>
              <span class="entry-pace-option__sub">想連著多走幾天，也可以。</span>
            </span>
          </label>
        </fieldset>

        <!-- P1: CTA 開始（was 繼續）— .btn-green via the legacy .entry-btn selector group -->
        <button type="submit" id="entry-btn" class="entry-btn">開始</button>
        <p id="entry-error" class="entry-error hidden"></p>
      </form>
    </div>
  </section>

  <!-- ─────────── §5.2 Journey — v2.1-green: 3-col snake + plants + path + treasures ─────────── -->
  <section id="view-journey" class="view" aria-label="你的旅程">
    <header class="app-header"><span class="label" id="journey-header-label">看見自己 · 第一天</span></header>

    <div class="journey-title-wrap">
      <!-- PR-4c-green P2: 「{preferredName} 的看見自己之旅」 + 「一步一步，走進自己」 -->
      <h2 class="journey-title" id="journey-title">你的看見自己之旅</h2>
      <p class="journey-sub">一步一步，走進自己</p>
    </div>

    <!-- Vivi 5/24: 5 寶藏移到 21 天格子上面、在標題副標之後、grid 之前.
         Vivi 5/25 上架前：寶藏教學內容還沒寫好（之後 Vivi+Damon 來）→ 兩個元素加
         `hidden`、可逆地藏起來. 不要做天數解鎖邏輯（phase-state.js 不動）.
         之後恢復＝拿掉這兩個 hidden 屬性即可. -->
    <h3 class="treasure-title" hidden>你的寶藏</h3>
    <div class="treasure-shelf" id="treasure-shelf" hidden>
      <!-- 5 phase treasures (locked at P2 — phases[] endpoint lands at P4) -->
    </div>

    <div class="journey-grid-wrap">
      <div class="journey-stage" id="journey-stage">
        <!-- snake-path SVG overlays the grid (z-index 0); tiles z-index 1.
             Path lives outside #journey-grid so renderJourney's innerHTML='' doesn't wipe it. -->
        <svg class="journey-path" aria-hidden="true">
          <path id="journey-path-line"
                stroke="var(--brand-green)" stroke-width="4"
                stroke-dasharray="1 12" stroke-linecap="round" fill="none" />
        </svg>
        <div class="journey-grid" id="journey-grid" role="list">
          <!-- 21 day-tiles injected by student.js (snake-positioned via grid-row/col) -->
        </div>
      </div>
    </div>

    <p id="journey-prompt" class="journey-prompt hidden">點開今天，從第一句開始。</p>
  </section>

  <!-- ─────────── §4.3 對話頁 / §4.4 收尾 ─────────── -->
  <section id="view-conversation" class="view" aria-label="對話">
    <header class="app-header"><span class="label" id="conv-header-label">看見自己 · 第一天</span></header>
    <div id="conv-scroll" class="conv-scroll" role="log" aria-live="polite" aria-atomic="false">
      <!-- AI / user messages injected by student.js -->
    </div>

    <!-- input bar (§4.3) — replaced by closure bar (§4.4) when AI ends the day -->
    <div id="conv-input-bar" class="conv-input-bar">
      <div class="conv-input-wrap">
        <div class="conv-input-row">
          <textarea id="conv-input" class="conv-input" rows="1" placeholder="" aria-label="輸入"></textarea>
          <!-- F1 (PR-4c-4d): Vivi-authorised override of UI §六 「無 Send 鈕」—
               testers don't know Enter sends. Paper aesthetic, NOT SaaS.
               Enter still sends; Shift+Enter still newlines. -->
          <button type="button" id="conv-send-btn" class="conv-send-btn" aria-label="送出" disabled>送出</button>
        </div>
        <!-- P3 (PR-4c-green) §5.3: simpler、warmer (was 「⋯ 想沉默一下，AI 會在這裡等你」) -->
        <p class="conv-hint">慢慢來，我等你</p>
        <!-- P3 (PR-4c-4f) — Day-1-only chain-追問 explainer (toggled by student.js).
             Tells the new student the teacher's repeated「對你有什麼重要?」is deliberate. -->
        <p id="conv-chain-hint" class="conv-hint--chain hidden">
          教練會用同樣的問題一層一層往下問——這是刻意的，不是卡住了。
        </p>
      </div>
    </div>

    <div id="conv-closure" class="conv-closure hidden">
      <!-- 5/25 Vivi: 米白底黑字 + 「教練在寫今天的字」JS 來回逐字打 (見 student.js). -->
      <span class="star">✦</span><span class="text">教練在寫今天的字</span>
    </div>
  </section>

  <!-- ─────────── §5.4 教練卡 — green sweep + new copy ─────────── -->
  <section id="view-note" class="view paper-page" aria-label="教練筆記">
    <header class="app-header" style="width:100%;"><span class="label" id="note-header-label">看見自己 · 第N天</span></header>
    <div style="height:52px"></div>
    <!-- PR-4c-green Patrick 5/24 — day hero scene above the paper card (set by renderNote) -->
    <figure class="day-hero day-hero--note">
      <img id="note-hero-img" class="day-hero__img" src="" alt="" loading="eager" decoding="async">
    </figure>
    <article class="paper-card">
      <div class="paper-card__header">
        <div class="paper-card__eyebrow">教練筆記</div>
        <div class="paper-card__divider"></div>
      </div>
      <div id="note-body" class="paper-card__body"></div>
      <div class="paper-card__sig">— 教練</div>
    </article>
    <!-- P3 (PR-4c-green): 「已收下」 → 「已收進你的旅程」 per spec §5.4 -->
    <div class="status-row"><span class="star">✦</span>已收進你的旅程</div>
    <!-- P3: button row context-aware — student.js toggles 「明天見」 visibility
         (shown only when arriving from the conversation closure transition;
         hidden when re-reading via a journey cell click). -->
    <div class="btn-row" id="note-btn-row">
      <button class="paper-btn" data-nav="journey">回到旅程</button>
      <button class="paper-btn" data-nav="journey" id="note-btn-tomorrow">明天見</button>
    </div>
  </section>

  <!-- §4.6 週報 view retired — PR-4c-green 5/24 cleanup. 5 phase reports
       (§5.5 view-phase-report below) replace the 3-bucket week structure. -->

  <!-- ─────────── §5.5 Phase Report — 你的寶藏 (P4 green) ─────────── -->
  <section id="view-phase-report" class="view paper-page" aria-label="你的寶藏">
    <header class="app-header" style="width:100%;">
      <span class="label" id="phase-header-label">看見自己 · 你的寶藏</span>
    </header>
    <div style="height:52px"></div>
    <article class="paper-card paper-card--wide paper-card--phase">
      <div class="paper-card__header">
        <div class="paper-card__eyebrow paper-card__eyebrow--phase" id="phase-eyebrow">PHASE I</div>
        <div class="paper-card__title" id="phase-title">—</div>
        <div class="paper-card__divider"></div>
      </div>
      <div id="phase-teaching" class="paper-card__body"></div>
      <div class="phase-section-sep" aria-hidden="true">✦</div>
      <div id="phase-breakthrough" class="paper-card__body"></div>
      <div class="paper-card__sig">— 教練見證</div>
    </article>
    <div class="status-row"><span class="star">✦</span>已收進你的寶藏</div>
    <div class="btn-row">
      <button class="paper-btn" data-nav="journey">回到旅程</button>
    </div>
  </section>

  <!-- ─────────── §5.6 結業 — green sweep + new copy ─────────── -->
  <section id="view-graduation" class="view paper-page" aria-label="結業">
    <header class="app-header" style="width:100%;"><span class="label" id="grad-header-label">看見自己 · 第二十一天</span></header>
    <div style="height:52px"></div>
    <article class="paper-card paper-card--graduation">
      <div class="paper-card__header">
        <div class="paper-card__eyebrow" style="letter-spacing:5px;">結業</div>
        <div class="paper-card__divider" style="width:32px;"></div>
      </div>

      <div id="grad-letter" class="paper-card__body" style="text-align:center;"></div>

      <div class="poem-block" id="grad-poem"><!-- 21 句詩 · joined → 3 lines --></div>

      <div class="paper-card__divider" style="margin:0 auto 28px;"></div>

      <p class="declaration-leadin">你說 ——</p>
      <p id="grad-declaration" class="declaration">—</p>

      <div class="paper-card__sig">— 教練見證</div>
    </article>
    <!-- P3 (PR-4c-green) §5.6: copy aligned to spec 08 (Day 21 emailed deep PDF) -->
    <p id="grad-export-notice" class="export-notice hidden">你完整的旅程報告，已經寄到你的信箱了。</p>
    <div class="status-row"><span class="star">✦</span>已收進你的旅程</div>
    <!-- P3: 「先這樣」 dropped per spec §5.6 — single button only -->
    <div class="btn-row">
      <button class="paper-btn" data-nav="journey">回到旅程</button>
    </div>
  </section>

</div>

<script src="/student.js"></script>
</body>
</html>
