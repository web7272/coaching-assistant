<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看見自己 · 教練後台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="coach-shell">
  <header class="coach-header">
    <h1 class="coach-title">看見自己 · 教練後台</h1>
    <nav class="coach-nav">
      <a href="/coach.html" id="nav-dashboard">學員清單</a>
      <!-- F4 (PR-4c-4d): v4 指標 link removed — v5 metrics dashboard is a separate
           future task. The /admin-v4-metrics.html page is still reachable directly
           but no longer surfaced from the coach nav (confused testers in #16). -->
      <a href="/api/auth/signout">登出</a>
    </nav>
  </header>

  <!-- View 1: 學員清單 -->
  <section id="coach-view-list">
    <div class="coach-section">
      <h2 class="coach-h2" id="coach-list-title">學員 · 全部</h2>
      <p class="muted" style="font-family:var(--font-sans);font-size:12px;margin-bottom:14px;">
        點任一行 → 看該學員的旅程 / 筆記 / 寶藏（5 phase report）/ 結業。
      </p>
      <!-- 6/3 Patrick — filter 下拉 (純 client-side, 不 re-fetch) -->
      <div class="coach-filter-bar"
           style="margin-bottom:14px;font-family:var(--font-sans);font-size:12px;">
        <label for="coach-filter" style="color:var(--text-secondary);margin-right:6px;">顯示</label>
        <select id="coach-filter"
                style="padding:5px 10px;font-family:var(--font-sans);font-size:12px;
                       background:var(--paper-card);border:0.5px solid var(--border-line);
                       border-radius:6px;color:var(--text-primary);cursor:pointer;">
          <option value="all">全部</option>
          <option value="beta">封測者</option>
          <option value="blocked">已停用</option>
          <option value="active">進行中（完成 Day 1+）</option>
          <option value="finished">已完成 Day 21</option>
          <option value="at_risk">14+ 天沒動</option>
        </select>
        <span id="coach-list-count" style="margin-left:10px;color:var(--text-faint);"></span>
      </div>
      <div class="coach-list" id="coach-students-list"></div>
    </div>
  </section>

  <!-- View 2: 單一學員 detail -->
  <section id="coach-view-student" class="hidden">
    <div class="coach-section">
      <div style="display:flex;align-items:baseline;justify-content:space-between;">
        <h2 class="coach-h2" id="coach-student-title">學員 · —</h2>
        <a href="#" id="coach-back" class="coach-nav" style="font-family:var(--font-sans);font-size:12px;">← 返回清單</a>
      </div>
      <p class="muted" id="coach-student-meta" style="font-family:var(--font-sans);font-size:12px;margin-bottom:18px;"></p>

      <!-- 5/27 Patrick — 編輯資料 (Vivi 不用再下 SQL 改 pace / preferred_name / is_beta).
           PATCH /api/students 是 coach-gated + COALESCE partial update. -->
      <details id="coach-edit-block" style="margin-top:14px;">
        <summary class="paper-btn" style="display:inline-block;padding:6px 14px;font-size:12px;cursor:pointer;letter-spacing:1px;">編輯資料</summary>
        <div style="margin-top:12px;padding:14px 16px;background:var(--paper-card);border:0.5px solid var(--border-line);border-radius:6px;max-width:480px;">
          <label style="display:block;margin-bottom:10px;font-size:12px;color:var(--text-secondary);">
            稱呼<br/>
            <input type="text" id="coach-edit-name" maxlength="50"
                   style="width:100%;padding:6px 10px;font-family:var(--font-serif);font-size:14px;margin-top:4px;" />
          </label>
          <label style="display:block;margin-bottom:10px;font-size:12px;color:var(--text-secondary);">
            步調<br/>
            <select id="coach-edit-pace"
                    style="width:100%;padding:6px 10px;font-family:var(--font-serif);font-size:14px;margin-top:4px;">
              <option value="daily">一天一輪（daily）</option>
              <option value="self-paced">依自己步調（self-paced）</option>
            </select>
          </label>
          <label style="display:block;margin-bottom:14px;font-size:12px;color:var(--text-secondary);">
            <input type="checkbox" id="coach-edit-isbeta" /> 封測者（is_beta）
          </label>

          <!-- ⭐ v5.2 第一塊 (Vivi 6/5) — active_context (program-level 21 天 program 主場景).
               下拉 5 enum + name (≤ 30) + definition (≤ 200). default 1 = 事業. -->
          <hr style="margin:14px 0;border:0;border-top:0.5px solid var(--border-line);" />
          <label style="display:block;margin-bottom:10px;font-size:12px;color:var(--text-secondary);">
            主場景（active_context）<br/>
            <select id="coach-edit-ctx-category"
                    style="width:100%;padding:6px 10px;font-family:var(--font-serif);font-size:14px;margin-top:4px;">
              <!-- options injected by coach.js _COACH_CONTEXT_OPTIONS -->
            </select>
          </label>
          <label style="display:block;margin-bottom:10px;font-size:12px;color:var(--text-secondary);">
            場景名稱（選填，≤ 30 字）<br/>
            <input type="text" id="coach-edit-ctx-name" maxlength="30"
                   placeholder="例:我跟先生的溝通"
                   style="width:100%;padding:6px 10px;font-family:var(--font-serif);font-size:14px;margin-top:4px;" />
          </label>
          <label style="display:block;margin-bottom:14px;font-size:12px;color:var(--text-secondary);">
            場景說明（選填，≤ 200 字）<br/>
            <textarea id="coach-edit-ctx-definition" maxlength="200" rows="3"
                      placeholder="例:主要是日常溝通、不含原生家庭"
                      style="width:100%;padding:6px 10px;font-family:var(--font-serif);font-size:14px;margin-top:4px;resize:vertical;"></textarea>
          </label>

          <button type="button" id="coach-edit-save"  class="btn-green" style="padding:6px 14px;">儲存</button>
          <button type="button" id="coach-edit-reset" class="paper-btn" style="padding:6px 14px;margin-left:6px;">還原</button>
          <div id="coach-edit-msg" style="margin-top:8px;font-size:12px;color:var(--text-secondary);"></div>
        </div>
      </details>

      <h2 class="coach-h2" style="margin-top:20px;">旅程縮圖（21 天）</h2>
      <div id="coach-journey-grid" class="coach-mini-grid"></div>
      <div id="coach-grad-cell" style="max-width:480px;margin-top:6px;"></div>

      <!-- P5 (PR-4c-green): 週報 retired (spec 09 §10). 5 Phase Reports (spec 09
           §5.5 / §8) — coach sees un-sanitized 突破彙整 via audience=coach.
           Vivi 5/25 上架前：教學內容未定 → 標題 + 容器加 hidden、可逆地藏起來.
           恢復＝拿掉這兩個 hidden 屬性. -->
      <h2 class="coach-h2" style="margin-top:28px;" hidden>你的寶藏（5 個 Phase Report · 教練看完整版）</h2>
      <div id="coach-phase-reports" style="display:flex;flex-direction:column;gap:10px;" hidden></div>

      <h2 class="coach-h2" style="margin-top:28px;">展開某天筆記</h2>
      <div id="coach-day-picker" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <div id="coach-day-note" class="coach-pre" style="min-height:80px;">點上方某一天看當日筆記。</div>

      <!-- 5/26 Vivi — 「前端學員筆記」 獨立 section、跟筆記區/transcript 區同階.
           顯示 sessions.notebook_page (學員前端那張暖卡), lazy-fetch per-day + cache.
           studentCard 由 /api/note?audience=coach 在 dd43a8d 起回傳. -->
      <h2 class="coach-h2" style="margin-top:28px;">前端學員筆記（學員實際收到的卡）</h2>
      <div id="coach-card-picker" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <button type="button" id="coach-card-copy" class="paper-btn"
              style="padding:6px 12px;font-size:12px;letter-spacing:1px;margin-bottom:10px;display:none;">📋 複製</button>
      <div id="coach-card-body" class="coach-pre" style="min-height:80px;">點上方某一天看學員那天收到的卡。</div>

      <!-- Vivi 5/25 C3 修正 — 完整對話自己有一排天數按鈕、直接點任一天看逐字、
           不依賴上面的「展開某天筆記」. 鐵律 #2 上鎖、lazy-fetch /api/admin/transcript. -->
      <h2 class="coach-h2" style="margin-top:28px;">完整對話（教練專用）</h2>
      <div id="coach-transcript-picker" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <button type="button" id="coach-transcript-copy" class="paper-btn"
              style="padding:6px 12px;font-size:12px;letter-spacing:1px;margin-bottom:10px;display:none;">📋 複製對話</button>
      <div id="coach-transcript-body" class="coach-transcript-box" style="min-height:80px;">點上方某一天看完整逐字對話。</div>

      <h2 class="coach-h2" style="margin-top:28px;">結業（若已生成）</h2>
      <div id="coach-graduation" class="coach-pre" style="min-height:60px;"></div>
    </div>
  </section>
</div>

<script src="/coach.js"></script>
</body>
</html>
