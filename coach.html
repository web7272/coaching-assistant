<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看見自己 · 教練後台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="coach-shell">
  <header class="coach-header">
    <h1 class="coach-title">看見自己 · 教練後台</h1>
    <nav class="coach-nav">
      <a href="/coach.html" id="nav-dashboard">學員清單</a>
      <!-- F4 (PR-4c-4d): v4 指標 link removed — v5 metrics dashboard is a separate
           future task. The /admin-v4-metrics.html page is still reachable directly
           but no longer surfaced from the coach nav (confused testers in #16). -->
      <a href="/api/auth/signout">登出</a>
    </nav>
  </header>

  <!-- View 1: 學員清單 -->
  <section id="coach-view-list">
    <div class="coach-section">
      <h2 class="coach-h2">學員 · 全部</h2>
      <p class="muted" style="font-family:var(--font-sans);font-size:12px;margin-bottom:14px;">
        點任一行 → 看該學員的旅程 / 筆記 / 寶藏（5 phase report）/ 結業。
      </p>
      <div class="coach-list" id="coach-students-list"></div>
    </div>
  </section>

  <!-- View 2: 單一學員 detail -->
  <section id="coach-view-student" class="hidden">
    <div class="coach-section">
      <div style="display:flex;align-items:baseline;justify-content:space-between;">
        <h2 class="coach-h2" id="coach-student-title">學員 · —</h2>
        <a href="#" id="coach-back" class="coach-nav" style="font-family:var(--font-sans);font-size:12px;">← 返回清單</a>
      </div>
      <p class="muted" id="coach-student-meta" style="font-family:var(--font-sans);font-size:12px;margin-bottom:18px;"></p>

      <h2 class="coach-h2" style="margin-top:20px;">旅程縮圖（21 天）</h2>
      <div id="coach-journey-grid" class="coach-mini-grid"></div>
      <div id="coach-grad-cell" style="max-width:480px;margin-top:6px;"></div>

      <!-- P5 (PR-4c-green): 週報 retired (spec 09 §10). 5 Phase Reports (spec 09
           §5.5 / §8) — coach sees un-sanitized 突破彙整 via audience=coach.
           Vivi 5/25 上架前：教學內容未定 → 標題 + 容器加 hidden、可逆地藏起來.
           恢復＝拿掉這兩個 hidden 屬性. -->
      <h2 class="coach-h2" style="margin-top:28px;" hidden>你的寶藏（5 個 Phase Report · 教練看完整版）</h2>
      <div id="coach-phase-reports" style="display:flex;flex-direction:column;gap:10px;" hidden></div>

      <h2 class="coach-h2" style="margin-top:28px;">展開某天筆記</h2>
      <div id="coach-day-picker" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <div id="coach-day-note" class="coach-pre" style="min-height:80px;">點上方某一天看當日筆記。</div>

      <!-- Vivi 5/25 C3 修正 — 完整對話自己有一排天數按鈕、直接點任一天看逐字、
           不依賴上面的「展開某天筆記」. 鐵律 #2 上鎖、lazy-fetch /api/admin/transcript. -->
      <h2 class="coach-h2" style="margin-top:28px;">完整對話（教練專用）</h2>
      <div id="coach-transcript-picker" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;"></div>
      <button type="button" id="coach-transcript-copy" class="paper-btn"
              style="padding:6px 12px;font-size:12px;letter-spacing:1px;margin-bottom:10px;display:none;">📋 複製對話</button>
      <div id="coach-transcript-body" class="coach-transcript-box" style="min-height:80px;">點上方某一天看完整逐字對話。</div>

      <h2 class="coach-h2" style="margin-top:28px;">結業（若已生成）</h2>
      <div id="coach-graduation" class="coach-pre" style="min-height:60px;"></div>
    </div>
  </section>
</div>

<script src="/coach.js"></script>
</body>
</html>
