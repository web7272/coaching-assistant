<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>再寄一次登入連結 ｜ 看見自己</title>
  <!--
    Patrick 6/3 — Login 簡頁 (回頭流 funnel 分流):
      Landing = 獲客流 (新訪客, 收 lead + 3 題問卷, POST /api/request-guide).
      Login   = 回頭流 (已認識品牌, 只要重新要 magic link, POST /api/auth/request-link).
    用 case: magic link 60 分鐘過期、user 想再要一個、不該逼回 Landing 重填問卷.
    Daniel 客服量降低.
    視覺對齊 Landing v1.9.2 brand (peach/terracotta/coral 系).
  -->
  <style>
    /* 7/15 v11 mini — 對齊 landing.html 品牌 (方案 C 字型 + 墨黑 CTA + 古銅金點綴) */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&display=swap');
    :root{
      /* v11 tokens */
      --bg-top:#F8F8F8; --bg-bot:#F4F4F4; --paper:#FFFFFF;
      --line:#E4E5E8; --line-soft:#EDEEF0;
      --ink:#2E333D; --ink-soft:#5A6270; --ink-dim:#9098A6;
      --gold:#D8B27F; --gold-deep:#B58F5C;
      /* CTA 墨黑實色 */
      --btn:#2E333D; --btn-txt:#FFFFFF; --btn-hover:#3A414D;
      --btn-sh:0 1px 2px rgba(46,51,61,.08),0 8px 20px -12px rgba(46,51,61,.28);
      /* 字型 (方案 C:西文 Newsreader/Inter 在前,吃拉丁字;中文 Noto 在後,吃 CJK) */
      --serif:"Newsreader","Noto Serif TC",Georgia,"Songti TC",serif;
      --sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
      --r-sm:8px; --r-md:12px;
      --t:.45s; --ease:cubic-bezier(.2,.7,.2,1);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.85;letter-spacing:.01em;
      background:linear-gradient(180deg,var(--bg-top),var(--bg-bot)) fixed;
      min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 28px;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    .login-wrap{max-width:420px;width:100%;text-align:center}
    .login-logo{display:block;max-width:140px;width:100%;height:auto;margin:0 auto 28px}
    h1{font-family:var(--serif);font-size:clamp(22px,4vw,28px);font-weight:700;color:var(--ink);
      margin:0 0 12px;letter-spacing:0;line-height:1.45}
    .sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);margin:0 0 36px;line-height:1.85}
    .login-form input[type=email]{width:100%;padding:14px 16px;border-radius:var(--r-md);font-size:15px;
      background:#F7F8FA;border:1.5px solid #5A5D64;color:var(--ink);font-family:var(--sans);outline:none;
      transition:border-color .2s}
    .login-form input[type=email]::placeholder{color:#8A8D94}
    .login-form input[type=email]:focus{border-color:var(--gold-deep)}
    .login-btn{width:100%;margin-top:14px;background:var(--btn);
      color:var(--btn-txt);border:0;border-radius:var(--r-md);padding:14px;font-size:15px;font-weight:600;cursor:pointer;
      letter-spacing:.02em;font-family:var(--sans);transition:background var(--t) var(--ease),box-shadow var(--t) var(--ease);
      box-shadow:var(--btn-sh)}
    .login-btn:hover{background:var(--btn-hover)}
    .login-btn:disabled{opacity:.5;cursor:not-allowed}
    .login-msg{margin-top:18px;font-size:13px;color:var(--ink-soft);line-height:1.7;min-height:20px}
    .login-msg.ok{color:var(--gold-deep)}
    .login-msg.err{color:#a33}
    .login-foot{margin-top:48px;font-family:var(--serif);font-size:13px;color:var(--ink-dim)}
    .login-foot a{color:var(--gold-deep);text-decoration:none}
    .login-foot a:hover{text-decoration:underline}
    .typo-hint{margin-top:6px;font-size:12px;color:var(--ink-soft);font-style:italic;text-align:left}
    .typo-btn{margin-left:8px;padding:2px 8px;font-size:11px;background:transparent;
      border:1px solid var(--line);border-radius:14px;color:var(--gold-deep);cursor:pointer;font-family:var(--sans)}
    :focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:var(--r-sm)}
  </style>
</head>
<body>
  <div class="login-wrap">
    <img class="login-logo" src="/assets/logo.png" alt="看見自己">
    <h1>再寄一次登入連結</h1>
    <p class="sub">為了保護你的帳號，登入連結只開放 60 分鐘有效。<br>
    舊的連結過期了沒關係，留下 email，新的馬上寄給你。</p>

    <form class="login-form" id="login-form" novalidate>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email" required>
      <div class="typo-hint" id="login-typo-hint" hidden></div>
      <button type="submit" class="login-btn" id="login-btn">寄出</button>
      <p class="login-msg" id="login-msg"></p>
    </form>

    <p class="login-foot">
      還沒體驗過？<a href="/landing.html">從這裡開始 →</a>
    </p>
  </div>

  <script>
    // 沿用 Landing 的 typo hint 邏輯(common typos: gmail/yahoo/icloud/outlook 等)
    function suggestEmailFix(value) {
      const v = (value || '').toLowerCase().trim();
      if (!v.includes('@')) return null;
      const [, domain] = v.split('@');
      if (!domain) return null;
      const typos = {
        'gmial.com':'gmail.com','gmal.com':'gmail.com','gmai.com':'gmail.com',
        'gnail.com':'gmail.com','gemail.com':'gmail.com',
        'yaho.com':'yahoo.com','yahoocom':'yahoo.com',
        'icoud.com':'icloud.com','icould.com':'icloud.com',
        'hotnail.com':'hotmail.com','hotmial.com':'hotmail.com',
        'outloo.com':'outlook.com',
      };
      const fix = typos[domain];
      if (fix) return v.replace(domain, fix);
      return null;
    }
    function validEmail(v){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((v||'').trim());}

    const form = document.getElementById('login-form');
    const emailEl = document.getElementById('login-email');
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('login-msg');
    const typoHint = document.getElementById('login-typo-hint');

    function refreshTypoHint() {
      const suggestion = suggestEmailFix(emailEl.value);
      if (!suggestion) {
        typoHint.hidden = true;
        typoHint.innerHTML = '';
        return;
      }
      typoHint.hidden = false;
      typoHint.innerHTML = `你是不是要輸入 <b>${suggestion}</b>?
        <button type="button" class="typo-btn" onclick="document.getElementById('login-email').value='${suggestion}';document.getElementById('login-typo-hint').hidden=true;">用建議的</button>`;
    }
    emailEl.addEventListener('input', refreshTypoHint);
    emailEl.addEventListener('blur', refreshTypoHint);

    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = ''; msg.className = 'login-msg';
      const email = (emailEl.value || '').trim().toLowerCase();
      if (!validEmail(email)) {
        msg.textContent = '這個 email 看起來不太對，再看一下。';
        msg.className = 'login-msg err';
        return;
      }
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '送出中…';
      try {
        await fetch('/api/auth/request-link', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email })
        });
        msg.innerHTML = `信寄到 <b>${email}</b>、60 分鐘內有效。<br>沒看到信? 找一下垃圾信／促銷匣。`;
        msg.className = 'login-msg ok';
        btn.textContent = '已寄出 ✓';
        emailEl.disabled = true;
      } catch (err) {
        msg.textContent = '網路好像斷了、再試一次。';
        msg.className = 'login-msg err';
        btn.disabled = false;
        btn.textContent = orig;
      }
    };
  </script>
</body>
</html>
