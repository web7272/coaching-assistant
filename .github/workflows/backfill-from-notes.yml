# .github/workflows/backfill-from-notes.yml
# 正式版 S5 — 用 Damon Notes 重生「我的人生旅途」七步 (新結構) → sc_storyboard。
#
# Trigger: workflow_dispatch.
#   commit=false (預設) → dry-run:只印 SAFE 報告 (meta + 已 gate 七步 + 探針)。
#   commit=true          → 寫 prod sc_storyboard (gated 內容;sc_journey_step/evidence 不動)。
#
# 🔴 安全:
#   1. 內容生成沿用 note-to-storyboard-gen.js (pre-scrub 進 LLM 前 + post-gate +
#      sovereign retry)。raw 筆記永不入報告/log。
#   2. 報告檔過 14-pattern SI leak-guard + role-marker guard;命中 → 刪檔 + fail。
#   3. commit 寫的是 gated 內容 (= 報告所示);gate 是主要保證, leak-guard 是 backstop
#      (沿用 backfill-commit.yml 既有風險姿態)。
#   4. Secrets 留 CI (GitHub auto-mask DATABASE_URL / ANTHROPIC_API_KEY)。

name: backfill-from-notes

on:
  workflow_dispatch:
    inputs:
      students:
        description: 'Space-separated student IDs (預設 = 7 老封測者).'
        required: false
        type: string
        default: 'A003 A005 A006 A008 A009 A011 A012'
      commit:
        description: 'true = 寫 prod sc_storyboard;false = dry-run 只印報告.'
        required: false
        type: boolean
        default: false
      model:
        description: '綜合用模型.'
        required: false
        type: string
        default: 'claude-sonnet-4-6'

permissions:
  contents: read

concurrency:
  group: backfill-from-notes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=warn

      - name: Syntax smoke test
        run: |
          node --check scripts/backfill-storyboard-from-notes.js
          node --check lib/api/note-to-storyboard-gen.js
          node --check lib/api/sc-storyboard-gen.js

      - name: Run from-notes backfill
        id: run
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDENTS:          ${{ inputs.students }}
          MODEL:             ${{ inputs.model }}
          COMMIT:            ${{ inputs.commit }}
        run: |
          set +e
          if [ -z "$DATABASE_URL" ];      then echo "::error::DATABASE_URL secret not set."; exit 1; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY secret not set."; exit 1; fi
          CLEAN_STUDENTS=$(echo "$STUDENTS" | tr -cd '[:alnum:]_ ')
          CLEAN_MODEL=$(echo "$MODEL" | tr -cd '[:alnum:].-')
          COMMIT_FLAG=""
          if [ "$COMMIT" = "true" ]; then COMMIT_FLAG="--commit"; echo "[workflow] COMMIT mode — will write prod sc_storyboard"; else echo "[workflow] dry-run mode"; fi
          node scripts/backfill-storyboard-from-notes.js \
            --students="$CLEAN_STUDENTS" \
            --model="$CLEAN_MODEL" \
            $COMMIT_FLAG \
            --report=report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 🔴 Defence-in-depth — verify report.md 0 SI leak (14 patterns)
        if: always()
        run: |
          set -e
          if [ ! -f report.md ]; then echo "::warning::no report.md"; exit 0; fi
          if grep -qE '自殺|想死|去死|輕生|自傷|割腕|上吊|跳樓|燒炭|不想活|無所眷念|傷害自己|傷害我自己|傷害了自己|自我傷害' report.md; then
            echo "::error::🔴🔴 report.md contains SI substring — defence-in-depth FAILED. File DELETED."
            rm -f report.md
            exit 1
          fi
          echo "✓ 0 SI substring in report.md"

      - name: 🔴 Defence-in-depth — verify report.md 0 conversation role markers
        if: always()
        run: |
          set -e
          if [ ! -f report.md ]; then exit 0; fi
          if grep -qiE '\b(role|user|assistant):' report.md; then
            echo "::error::🔴🔴 report.md contains role markers. File DELETED."
            rm -f report.md
            exit 1
          fi
          echo "✓ 0 role markers in report.md"

      - name: 🔵 Render report.md into $GITHUB_STEP_SUMMARY
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; echo "✓ rendered"; else echo "::warning::no report.md to render"; fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-from-notes-${{ github.run_id }}
          path: report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Fail workflow if run errored
        if: always()
        run: |
          EXIT="${{ steps.run.outputs.exit_code }}"
          if [ -z "$EXIT" ]; then EXIT="1"; fi
          if [ "$EXIT" != "0" ]; then echo "::error::run exit code: $EXIT"; exit 1; fi
          echo "🟢 from-notes backfill green — read STEP_SUMMARY"
