<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教練後台登入</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- PR-4c-green Auth rebuild stage 1b — replaces the dead Google OAuth button.
     Sharing passcode model (Vivi 拍板 option B): coach enters COACH_PASSCODE,
     /api/coach-auth verifies + sets coach_session cookie, redirect to /coach. -->
<div class="coach-shell" style="max-width:440px;padding-top:96px;">
  <article class="paper-card" style="text-align:center;">
    <div class="paper-card__header">
      <div class="paper-card__eyebrow">教練後台</div>
      <div class="paper-card__divider"></div>
    </div>
    <p class="muted" style="font-family:var(--font-serif);font-style:italic;font-size:13px;line-height:1.8;margin-bottom:24px;">
      請輸入教練通行碼。
    </p>
    <form id="coach-login-form" autocomplete="off">
      <input type="password" id="coach-passcode" class="entry-input" placeholder="通行碼" autocomplete="current-password" required style="text-align:center;letter-spacing:4px;">
      <button type="submit" id="coach-submit" class="btn-green" style="display:block;width:100%;margin-top:18px;">送出</button>
      <p id="coach-error" class="entry-error hidden" style="margin-top:14px;">通行碼錯誤、再試一次。</p>
    </form>
    <p class="muted" style="font-family:var(--font-serif);font-style:italic;font-size:11px;color:var(--text-faint);margin-top:28px;line-height:1.7;">
      這個頁面只供教練使用。<br>學員請回到主頁。
    </p>
  </article>
</div>

<script>
(function() {
  const form = document.getElementById('coach-login-form');
  const input = document.getElementById('coach-passcode');
  const error = document.getElementById('coach-error');
  const submit = document.getElementById('coach-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.classList.add('hidden');
    submit.disabled = true;
    submit.textContent = '送出中…';
    try {
      const res = await fetch('/api/coach-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode: input.value }),
      });
      if (res.ok) {
        location.href = '/coach.html';
        return;
      }
      error.classList.remove('hidden');
      input.value = '';
      input.focus();
    } catch {
      error.classList.remove('hidden');
    } finally {
      submit.disabled = false;
      submit.textContent = '送出';
    }
  });
})();
</script>
</body>
</html>
