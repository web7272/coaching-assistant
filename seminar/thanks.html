<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FBF9F4">
<title>報名完成｜問對問題 免費線上講座 · 9/30</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF9F4; --paper-2:#F5F1E8;
  --ink:#2B2724; --ink-2:#5F574C; --ink-3:#6E6659;
  --gold:#8A5F2C; --gold-soft:#C9A574; --gold-line:#B8934F; --gold-bg:#FAF5EC;
  --rule:#E5DFD3; --dark:#221D19; --on-dark:#FCFAF6;
  --r-card:4px; --r-pill:999px;
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color-scheme:light only}
body{color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.9;letter-spacing:.02em;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;margin-bottom:40px}
.brand-mark{flex:none;display:inline-flex;color:var(--gold-line)}
.brand-mark svg{width:34px;height:34px;display:block}
.brand-spark{fill:var(--gold-soft)}
.brand-name{font-family:var(--serif);font-weight:600;letter-spacing:.06em;font-size:18px;line-height:1.1}
.brand-name span{display:block;font-family:var(--sans);font-weight:300;letter-spacing:.26em;color:var(--ink-3);font-size:9.5px;margin-top:-2px}
.card{max-width:560px;width:100%;text-align:center}
.eyebrow{letter-spacing:.24em;color:var(--gold);font-size:12px;margin-bottom:20px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.35;letter-spacing:.03em;margin-bottom:20px}
.lead{color:var(--ink-2);line-height:2.05;font-size:clamp(15px,1.7vw,17px);max-width:30em;margin:0 auto}
.when{display:inline-flex;flex-direction:column;gap:6px;align-items:center;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px 30px;margin:30px 0 30px}
.when b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:clamp(19px,2.6vw,24px);letter-spacing:.03em}
.when span{color:var(--ink-2);font-size:14px}
.cal{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.cal a{display:inline-block;padding:12px 24px;border-radius:var(--r-pill);text-decoration:none;font-size:15px;transition:.2s}
.cal a.primary{background:var(--ink);color:var(--paper)}
.cal a.primary:hover{opacity:.85}
.cal a.ghost{border:1px solid var(--gold-soft);color:var(--ink-2)}
.cal a.ghost:hover{color:var(--gold);border-color:var(--gold)}
.prompt{background:var(--gold-bg);border:1px solid var(--gold-soft);border-radius:var(--r-card);
  padding:26px 30px;text-align:left;max-width:32em;margin:0 auto}
.prompt .k{letter-spacing:.16em;color:var(--gold);font-size:12px;margin-bottom:10px}
.prompt p{font-family:var(--serif);color:var(--ink);line-height:1.85;font-size:clamp(16px,2vw,19px)}
.foot{margin-top:48px;color:var(--ink-3);font-size:13px;line-height:1.9;text-align:center}
</style>
</head>
<body>
  <a class="brand" href="/seminar">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="60" r="15"/><circle cx="66" cy="60" r="15"/><path d="M28 47 L34 32 H44"/><path d="M56 32 H66 L72 47"/><path class="brand-spark" d="M84 22 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6-4 -4-1.6 4-1.6 z" stroke="none"/></svg></span>
    <span class="brand-name">看見自己<span>SEE YOURSELF</span></span>
  </a>

  <main class="card">
    <div class="eyebrow">報名完成</div>
    <h1>你報名了。<br>我們 9/30 見。</h1>
    <p class="lead">開始前,我們會把講座連結寄到你的信箱。沒收到的話,看一下垃圾信／促銷匣,或把 help@seeyourself.now 加到聯絡人。</p>

    <div class="when">
      <b>9 月 30 日（三）</b>
      <span>台灣時間晚上 9:00 · 90 分鐘 · 線上</span>
    </div>

    <div class="cal">
      <a class="primary" id="gcal" href="#" target="_blank" rel="noopener">加入 Google 行事曆</a>
      <a class="ghost" id="ics" href="#" download="問對問題講座.ics">下載到 Apple／Outlook</a>
    </div>

    <div class="prompt">
      <div class="k">開始前,你可以先想一件事</div>
      <p>你最近最想問自己的一個問題,是什麼?<br>把它帶來講座。</p>
    </div>
  </main>

  <div class="foot">看見自己團隊 See Yourself</div>

<script>
(function(){
  var title="問對問題｜免費線上講座";
  var details="90 分鐘,一起看看能翻轉什麼問題。開始前連結會另外寄到你的信箱。";
  var loc="線上";
  var start="20260930T130000Z", end="20260930T143000Z"; /* 台灣 21:00–22:30 = UTC 13:00–14:30 */
  var g="https://www.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(title)
    +"&dates="+start+"/"+end
    +"&details="+encodeURIComponent(details)
    +"&location="+encodeURIComponent(loc);
  document.getElementById('gcal').href=g;
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//seeyourself//seminar//TW","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:seminar-20260930@seeyourself.now","DTSTAMP:"+start,"DTSTART:"+start,"DTEND:"+end,
    "SUMMARY:"+title,"DESCRIPTION:"+details,"LOCATION:"+loc,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  document.getElementById('ics').href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
})();
</script>
</body>
</html>
